[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tm1craft-client"
version = "0.5.0"  # `cz bump` rewrites this line (see version_files in .cz.toml)
description = "Headless TM1 capture client for tm1craft — download TM1 model objects with TM1py and hand them to a tm1craft service to build the model graph"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Cubewise-JoeCHK" }]
requires-python = ">=3.11"
dependencies = [
    "TM1py>=2.3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Office/Business",
]
keywords = ["tm1", "tm1py", "olap", "business-intelligence", "planning", "model-capture"]

[project.urls]
Homepage = "https://github.com/Cubewise-JoeCHK/tm1craft-client"
Repository = "https://github.com/Cubewise-JoeCHK/tm1craft-client"
Changelog = "https://github.com/Cubewise-JoeCHK/tm1craft-client/blob/main/CHANGELOG.md"

[project.scripts]
tm1craft-client = "tm1craft_client.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "commitizen>=4.0",
    # The Windows drop-in build (.github/scripts/build-windows-exe.sh, #12):
    # a build tool, never a runtime dependency.
    "pyinstaller>=6",
    "pytest>=8.0",
    "ruff>=0.8",
]
